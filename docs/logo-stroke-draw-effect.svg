<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1323.32 272" style="max-width:900px;">
  <defs>
    <style>
      .p0 { fill: none; stroke: #F2610C; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .p1 { fill: #F2610C; }
      .pm { stroke-dasharray: 1200; animation: strokeCycle 6s ease-in-out 0.0s infinite backwards; }
      .pmf { animation: fillCycle 6s ease-in-out 0.0s infinite backwards; }
      .pe1 { stroke-dasharray: 800; animation: strokeCycle 6s ease-in-out 0.25s infinite backwards; }
      .pe1f { animation: fillCycle 6s ease-in-out 0.25s infinite backwards; }
      .pe2 { stroke-dasharray: 800; animation: strokeCycle 6s ease-in-out 0.5s infinite backwards; }
      .pe2f { animation: fillCycle 6s ease-in-out 0.5s infinite backwards; }
      .pp { stroke-dasharray: 900; animation: strokeCycle 6s ease-in-out 0.7s infinite backwards; }
      .ppf { animation: fillCycle 6s ease-in-out 0.7s infinite backwards; }
      .pz { stroke-dasharray: 800; animation: strokeCycle 6s ease-in-out 0.9s infinite backwards; }
      .pzf { animation: fillCycle 6s ease-in-out 0.9s infinite backwards; }
      .po { stroke-dasharray: 600; animation: strokeCycle 6s ease-in-out 1.1s infinite backwards; }
      .pof { animation: fillCycle 6s ease-in-out 1.1s infinite backwards; }
      .pr { stroke-dasharray: 400; animation: strokeCycle 6s ease-in-out 1.3s infinite backwards; }
      .prf { animation: fillCycle 6s ease-in-out 1.3s infinite backwards; }
      .pa { stroke-dasharray: 900; animation: strokeCycle 6s ease-in-out 1.7s infinite backwards; }
      .paf { animation: fillCycle 6s ease-in-out 1.7s infinite backwards; }
      @keyframes strokeCycle {
        0% { stroke-dashoffset: 1200; opacity: 0; }
        6% { opacity: 1; }
        16% { stroke-dashoffset: 0; opacity: 1; }
        56% { stroke-dashoffset: 0; opacity: 1; }
        68% { stroke-dashoffset: 0; opacity: 0.1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes fillCycle {
        0%, 16% { opacity: 0; }
        26% { opacity: 1; }
        56% { opacity: 1; }
        68% { opacity: 0.1; }
        100% { opacity: 0; }
      }
      @media (prefers-reduced-motion:reduce){*{animation:none !important}}
    </style>
  </defs>
