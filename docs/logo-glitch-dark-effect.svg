<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1323.32 272" style="max-width:900px; background:#0a0a0a;">
  <defs>
    <style>
      .c0 { fill: #F2610C; }
      .c1 { fill: #00f0ff; }
      .c2 { fill: #ff00a0; }
      .cm { animation: glitchAppear 4s ease-in-out 0.0s infinite backwards; }
      .ce1 { animation: glitchAppear 4s ease-in-out 0.12s infinite backwards; }
      .ce2 { animation: glitchAppear 4s ease-in-out 0.24s infinite backwards; }
      .cp { animation: glitchAppear 4s ease-in-out 0.36s infinite backwards; }
      .cz { animation: glitchAppear 4s ease-in-out 0.48s infinite backwards; }
      .co { animation: glitchAppear 4s ease-in-out 0.6s infinite backwards; }
      .cr { animation: glitchAppear 4s ease-in-out 0.72s infinite backwards; }
      .ca { animation: glitchAppear 4s ease-in-out 0.84s infinite backwards; }
      @keyframes glitchAppear {
        0% { opacity: 0; transform: translateX(-8px) skewX(-2deg); filter: blur(3px); }
        8% { opacity: 1; transform: translateX(2px) skewX(1deg); filter: blur(0); }
        10% { opacity: 1; transform: translateX(-1px) skewX(0); }
        12% { opacity: 1; transform: translateX(0); }
        88% { opacity: 1; transform: translateX(0); }
        90% { opacity: 1; transform: translateX(3px); }
        92% { opacity: 0.3; transform: translateX(-5px) skewX(2deg); filter: blur(2px); }
        100% { opacity: 0; transform: translateX(8px); filter: blur(4px); }
      }
      @keyframes rgbShift {
        0%, 20%, 40%, 60%, 80%, 100% { opacity: 0; transform: translateX(0); }
        10% { opacity: 0.5; transform: translateX(-3px); }
        30% { opacity: 0.3; transform: translateX(2px); }
        50% { opacity: 0.6; transform: translateX(-2px); }
        70% { opacity: 0.4; transform: translateX(3px); }
      }
      @keyframes scanMove {
        0% { transform: translateY(-10px); opacity: 0; }
        5% { opacity: 0.6; }
        95% { opacity: 0.6; }
        100% { transform: translateY(250px); opacity: 0; }
      }
      .cc-m { animation: rgbShift 4s infinite 1.1s; opacity: 0; }
      .cm-m { animation: rgbShift 4s infinite 1.3s; opacity: 0; }
      .cc-e { animation: rgbShift 4s infinite 1.6s; opacity: 0; }
      .cm-p { animation: rgbShift 4s infinite 1.9s; opacity: 0; }
      .cc-a { animation: rgbShift 4s infinite 2.2s; opacity: 0; }
      .scan { fill: rgba(242,97,12,0.12); animation: scanMove 3s linear 1.5s infinite; }
      @media (prefers-reduced-motion:reduce){*{animation:none !important}}
    </style>
  </defs>
