name: CI critical path diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-full:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: desktop/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/go-build-cache
        with:
          module: desktop
          dependency: desktop/go.sum
      - run: node scripts/ci-go-shard.mjs --count 1 --index 1 --output "$RUNNER_TEMP/desktop-full"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-full-${{ matrix.sample }}
          path: ${{ runner.temp }}/desktop-full
          retention-days: 14
  root-profile:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      DEEPZORA_RELEASE_CACHE_GUARD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          module: root
          dependency: go.sum
      - run: go mod download
      - name: Build root module
        run: go build ./...
      - name: Profile complete root test execution
        run: go test -json -timeout=15m ./... > "$RUNNER_TEMP/root-tests.jsonl"
      - name: Test both Windows PowerShell runtimes
        shell: pwsh
        run: |
          foreach ($program in @('pwsh', 'powershell.exe')) {
            $env:DEEPZORA_TEST_PWSH = (Get-Command $program).Source
            go test -timeout=2m -run '^TestPowerShell' ./internal/persistentshell
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: root-profile
          path: ${{ runner.temp }}/root-tests.jsonl
          retention-days: 14
  activation-under-io:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: desktop/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          module: desktop
          dependency: desktop/go.sum
      - name: Observe activation while real package tests exercise disk and process I/O
        shell: pwsh
        run: |
          $load = Start-Process go -ArgumentList @('test','-count=1','-timeout=15m','./internal/agent','./internal/worktree') -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/load.out" -RedirectStandardError "$env:RUNNER_TEMP/load.err"
          Push-Location desktop
          go test -json -count=100 -timeout=15m -run '^TestStartTopicActivationReadyDoesNotWaitForRebuildMutex$' . > "$env:RUNNER_TEMP/activation.jsonl"
          $result = $LASTEXITCODE
          Pop-Location
          $load.WaitForExit()
          if ($result -ne 0) { exit $result }
          exit $load.ExitCode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: activation-under-io
          path: |
            ${{ runner.temp }}/activation.jsonl
            ${{ runner.temp }}/load.out
            ${{ runner.temp }}/load.err
          retention-days: 14
