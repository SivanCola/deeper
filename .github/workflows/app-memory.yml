name: App memory screening

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: app-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      memory: ${{ steps.paths.outputs.memory }}
      memory_profile: ${{ steps.profile.outputs.profile }}
      memory_shards: ${{ steps.profile.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - id: paths
        run: node scripts/ci-paths.mjs --head "$EXPECTED_SOURCE_SHA" --full --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Select memory profile
        id: profile
        run: |
          echo 'profile=full' >> "$GITHUB_OUTPUT"
          echo 'shards=[1,2,3]' >> "$GITHUB_OUTPUT"
          echo 'Manual full App memory screening: three shards.' >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: changes
    if: needs.changes.outputs.memory == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DEEPZORA_APP_MEMORY_PROFILE: ${{ needs.changes.outputs.memory_profile }}
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install memory dependencies
        run: pnpm install --frozen-lockfile
      - run: node --test bench/app-memory-shards.test.mjs bench/app-memory-paths.test.mjs bench/app-memory-timing.test.mjs
      - name: Build memory frontend
        run: pnpm build
      - run: node bench/app-memory-prepare.mjs "$RUNNER_TEMP/app-memory-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-memory-build-${{ github.run_id }}
          path: ${{ runner.temp }}/app-memory-build
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  shard:
    needs: [changes, prepare]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.memory_shards) }}
    env:
      DEEPZORA_APP_MEMORY_PROFILE: ${{ needs.changes.outputs.memory_profile }}
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install memory dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser runtimes
        run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-memory-build-${{ github.run_id }}
          path: ${{ runner.temp }}/app-memory-build
      - run: cp -a "$RUNNER_TEMP/app-memory-build/dist/." dist/
      - name: Run complete independent memory process
        env:
          DEEPZORA_APP_MEMORY_SHARD: ${{ matrix.shard }}
          DEEPZORA_APP_MEMORY_PREPARED: ${{ runner.temp }}/app-memory-build/identity.json
          DEEPZORA_APP_MEMORY_ARTIFACTS: ${{ runner.temp }}/app-memory-results
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: node bench/app-memory.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: app-memory-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/app-memory-results
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  app-memory:
    if: always()
    needs: [changes, prepare, shard]
    runs-on: ubuntu-22.04
    steps:
      - name: Verify all prerequisite jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.memory }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          MEMORY_PROFILE: ${{ needs.changes.outputs.memory_profile }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$SHOULD_RUN" = true ]; then
            test "$MEMORY_PROFILE" = short || test "$MEMORY_PROFILE" = full
            test "$PREPARE_RESULT" = success
            test "$SHARD_RESULT" = success
          else
            test "$SHOULD_RUN" = false
            test "$MEMORY_PROFILE" = off
            test "$PREPARE_RESULT" = skipped
            test "$SHARD_RESULT" = skipped
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.memory == 'true'
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.changes.outputs.memory == 'true'
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.changes.outputs.memory == 'true'
        with:
          pattern: app-memory-shard-*-${{ github.run_id }}
          path: ${{ runner.temp }}/app-memory-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.changes.outputs.memory == 'true'
        with:
          name: app-memory-build-${{ github.run_id }}
          path: ${{ runner.temp }}/app-memory-build
      - name: Verify same-build complete protocol
        if: needs.changes.outputs.memory == 'true'
        run: |
          node desktop/frontend/bench/app-memory-aggregate.mjs \
            "$RUNNER_TEMP/app-memory-reports" "$RUNNER_TEMP/app-memory-build/identity.json" \
            "$RUNNER_TEMP/app-memory-report.json" "$EXPECTED_SOURCE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() && needs.changes.outputs.memory == 'true'
        with:
          name: app-memory-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-memory-report.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: always() && needs.changes.outputs.memory == 'true'
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          path: .ci-metrics-source
      - name: Summarize memory timing
        if: always() && needs.changes.outputs.memory == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/memory-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/memory-jobs.json"
          node .ci-metrics-source/scripts/ci-timings.mjs \
            --run "$RUNNER_TEMP/memory-run.json" \
            --jobs "$RUNNER_TEMP/memory-jobs.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --title "App memory timing"
