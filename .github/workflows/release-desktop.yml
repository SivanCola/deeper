name: Release desktop
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Recovery channel
        type: choice
        options:
        - stable
        default: stable
      tag:
        description: 'stable: tag to publish (e.g. desktop-v1.1.0)'
        required: false
        type: string
      production_signing_smoke:
        description: Verify production signing and trust without publishing
        required: false
        default: false
        type: boolean
      signing_preflight:
        description: Auto-approve through CI, verify the full signing path, attest it, and do not publish
        required: false
        default: false
        type: boolean
  workflow_call:
    outputs:
      artifact_prefix:
        description: Signed artifacts produced by this candidate invocation
        value: ${{ jobs.resolve.outputs.artifact_prefix }}
      signing_fingerprint:
        description: Validated Certum and packaging policy fingerprint
        value: ${{ jobs.signing-contract.outputs.fingerprint }}
    inputs:
      channel:
        description: Release channel selected by the approved orchestrator
        required: true
        type: string
      tag:
        description: Existing desktop tag to publish
        required: false
        default: ''
        type: string
      approved_cli_tag:
        description: Stable CLI tag recorded by the approved orchestrator
        required: true
        type: string
      approved_sha:
        description: Immutable commit recorded by the approved orchestrator
        required: true
        type: string
      orchestrated:
        description: True only when called by an approved release orchestrator
        required: false
        default: false
        type: boolean
      orchestrator:
        description: Trusted release orchestrator
        required: false
        default: stable
        type: string
      signing_preflight:
        description: Verify both Windows signing stages without publishing
        required: false
        default: false
        type: boolean
      candidate_preparation:
        description: Build, sign, and accept an untagged Stable candidate without publishing
        required: false
        default: false
        type: boolean
      candidate_rehearsal:
        description: Isolated non-publishing candidate rehearsal
        required: false
        default: false
        type: boolean
      signing_preflight_verified:
        description: The approved stable caller completed signing_preflight in this run
        required: false
        default: false
        type: boolean
      preflight_artifact_prefix:
        description: Signed artifact set returned by a verified candidate preparation
        required: false
        default: ''
        type: string
      candidate_id:
        description: Sealed release candidate identity
        required: false
        default: ''
        type: string
      candidate_source_run_id:
        description: Trusted candidate producer run
        required: false
        default: ''
        type: string
      candidate_source_run_attempt:
        description: Trusted candidate producer attempt
        required: false
        default: ''
        type: string
      candidate_control_sha:
        description: Control-plane SHA that built the sealed candidate
        required: false
        default: ''
        type: string
      candidate_signing_fingerprint:
        description: Signing policy fingerprint sealed with the candidate
        required: false
        default: ''
        type: string
      candidate_verified:
        description: Protected Stable preflight verified candidate provenance and bytes
        required: false
        default: false
        type: boolean
concurrency:
  group: release-desktop-${{ 'stable' }}
  cancel-in-progress: false
env:
  MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
permissions:
  contents: write
jobs:
  resolve:
    name: resolve Desktop release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      notes_version: ${{ steps.release.outputs.notes_version }}
      windows_signing: ${{ steps.windows.outputs.mode }}
      sha: ${{ steps.candidate.outputs.sha }}
      artifact_prefix: ${{ format('desktop-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.signing_preflight && 'preflight' || 'release') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Resolve version and channel
      id: release
      env:
        EVENT_NAME: ${{ github.event_name }}
        IN_ORCHESTRATED: ${{ inputs.orchestrated }}
        IN_CHANNEL: ${{ inputs.channel }}
        IN_TAG: ${{ inputs.tag }}
        IN_PRODUCTION_SIGNING_SMOKE: ${{ inputs.production_signing_smoke }}
        IN_SIGNING_PREFLIGHT: ${{ inputs.signing_preflight }}
        REF_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
      run: bash scripts/resolve-desktop-release.sh
    - name: Resolve explicit Windows release policy
      id: windows
      env:
        VERSION: ${{ steps.release.outputs.version }}
        CHANNEL: ${{ steps.release.outputs.channel }}
      run: echo "mode=$(node scripts/release-windows-policy.mjs "$VERSION" "$CHANNEL")" >> "$GITHUB_OUTPUT"
    - name: Resolve immutable candidate
      id: candidate
      env:
        RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
        IN_ORCHESTRATED: ${{ inputs.orchestrated }}
        IN_ORCHESTRATOR: ${{ inputs.orchestrator }}
        APPROVED_SHA: ${{ inputs.approved_sha }}
        CALLER_EVENT_NAME: ${{ github.event_name }}
        CALLER_REF: ${{ github.ref }}
        CALLER_REF_PROTECTED: ${{ github.ref_protected }}
        CALLER_SHA: ${{ github.sha }}
        CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
        CANDIDATE_PREPARATION: ${{ inputs.candidate_preparation }}
        CANDIDATE_REHEARSAL: ${{ inputs.candidate_rehearsal }}
      run: bash scripts/resolve-desktop-candidate.sh
  orchestration-guard:
    name: verify approved orchestrator
    needs: resolve
    if: ${{ inputs.orchestrated }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Verify caller and approved release ref
      env:
        ACTUAL_CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        EXPECTED_CALLER_WORKFLOW_REF: ${{ format('{0}/.github/workflows/release-{1}.yml@{2}', github.repository, inputs.orchestrator, github.ref) }}
        CALLER_EVENT_NAME: ${{ github.event_name }}
        CALLER_REF: ${{ github.ref }}
        CALLER_REF_PROTECTED: ${{ github.ref_protected }}
        CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
        CALLER_SHA: ${{ github.sha }}
        APPROVED_CLI_TAG: ${{ inputs.approved_cli_tag }}
        APPROVED_SHA: ${{ inputs.approved_sha }}
        APPROVED_CHANNEL: ${{ (inputs.orchestrator == 'candidate' || inputs.orchestrator == 'promote') && 'stable' || inputs.orchestrator }}
        RELEASE_TAG: ${{ inputs.approved_cli_tag }}
        VERIFY_RELEASE_CHECKOUT: false
      run: |
        bash scripts/verify-release-authorization.sh
        if [ "${{ inputs.candidate_preparation }}" != "true" ]; then
          bash scripts/verify-release-tag.sh
        fi
  release-gate:
    name: approve standalone desktop release
    needs: resolve
    if: ${{ !inputs.orchestrated }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release
    steps:
    - env:
        RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      run: echo "Approved standalone desktop $RELEASE_CHANNEL release $RELEASE_TAG"
  signing-contract:
    name: validate Windows release signing contract
    needs:
    - resolve
    - orchestration-guard
    - release-gate
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && ((inputs.orchestrated && needs.orchestration-guard.result == 'success') || (!inputs.orchestrated
      && needs.release-gate.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      fingerprint: ${{ steps.contract.outputs.fingerprint }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Validate signing mode
      env:
        PREFLIGHT_ARTIFACT_PREFIX: ${{ inputs.preflight_artifact_prefix }}
      run: |
        if [ "${{ inputs.production_signing_smoke }}" = "true" ] && [ "${{ inputs.signing_preflight }}" = "true" ]; then
          echo "::error::production_signing_smoke and signing_preflight are mutually exclusive"
          exit 1
        fi
        if [ "${{ inputs.candidate_preparation }}" = "true" ] && { [ "${{ inputs.signing_preflight }}" != "true" ] || [ "${{ inputs.orchestrator }}" != "candidate" ]; }; then
          echo "::error::candidate preparation must use the protected candidate orchestrator and signing preflight"
          exit 1
        fi
        if [ "${{ inputs.signing_preflight_verified }}" = "true" ] && [ "${{ inputs.orchestrated }}" != "true" ]; then
          echo "::error::only the approved stable orchestrator can assert signing_preflight_verified"
          exit 1
        fi
        if [ -n "$PREFLIGHT_ARTIFACT_PREFIX" ]; then
          if [ "${{ inputs.orchestrated }}" != "true" ] || [ "${{ inputs.signing_preflight_verified }}" != "true" ] || [ "${{ inputs.signing_preflight }}" = "true" ] || [ "${{ inputs.channel }}" != "stable" ]; then
            echo "::error::artifact reuse requires a verified stable orchestrator preflight"
            exit 1
          fi
          if [ "${{ inputs.candidate_verified }}" = "true" ]; then
            [[ "${{ inputs.candidate_id }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{12}-[0-9a-f]{12}$ ]] || exit 1
            [[ "${{ inputs.candidate_source_run_id }}" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "${{ inputs.candidate_source_run_attempt }}" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "${{ inputs.candidate_control_sha }}" =~ ^[0-9a-f]{40}$ ]] || exit 1
            test -n "${{ inputs.candidate_signing_fingerprint }}"
            bash scripts/check-candidate-desktop-prefix.sh "$PREFLIGHT_ARTIFACT_PREFIX" \
              "${{ inputs.candidate_source_run_id }}" "${{ inputs.candidate_source_run_attempt }}"
          else
            [[ "$PREFLIGHT_ARTIFACT_PREFIX" =~ ^desktop-${GITHUB_RUN_ID}-[1-9][0-9]*-preflight$ ]] || exit 1
          fi
        fi
    - name: Validate and fingerprint release signing contract
      id: contract
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        go run ./cmd/release-signing-contract validate
        fingerprint="$(go run ./cmd/release-signing-contract fingerprint)"
        if [ "${{ inputs.candidate_verified }}" = "true" ] && [ "$fingerprint" != "${{ inputs.candidate_signing_fingerprint }}" ]; then
          # Publication reuses the already signed candidate bytes. A protected
          # control-only repair may change this job without changing the
          # candidate's original signing policy or any publisher job.
          fingerprint="$(node scripts/verify-candidate-signing-repair.mjs \
            '${{ inputs.candidate_control_sha }}' '${{ inputs.candidate_signing_fingerprint }}')"
        fi
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
    - name: Require current standalone signing attestation
      if: ${{ github.repository == 'SivanCola/deepzora' && !inputs.signing_preflight && !inputs.production_signing_smoke && !(inputs.orchestrated && inputs.signing_preflight_verified)
        }}
      env:
        ACTUAL: ${{ vars.RELEASE_SIGNING_ATTESTATION }}
        EXPECTED: ${{ steps.contract.outputs.fingerprint }}
      run: |
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::RELEASE_SIGNING_ATTESTATION does not match the current protected signing contract"
          echo "::error::Run release-desktop.yml with signing_preflight=true before publishing"
          echo "expected=$EXPECTED"
          exit 1
        fi
  build:
    name: build non-Windows (${{ matrix.name }}, ${{ inputs.signing_preflight && 'preflight' || 'release' }})
    needs:
    - resolve
    - signing-contract
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.signing-contract.result == 'success' && inputs.preflight_artifact_prefix == ''
      }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          platform: darwin/arm64
          name: darwin-arm64
        - runner: macos-15-intel
          platform: darwin/amd64
          name: darwin-amd64
        - runner: macos-15
          platform: darwin/universal
          name: darwin-universal
        - runner: ubuntu-22.04
          platform: linux/amd64
          name: linux-amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.resolve.outputs.sha }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: desktop/go.mod
        cache: true
        cache-dependency-path: desktop/go.sum
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 10
        run_install: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: desktop/pnpm-lock.yaml
    - name: Install nfpm
      if: runner.os == 'Linux'
      run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
    - name: Install create-dmg
      if: runner.os == 'macOS'
      run: brew install create-dmg
    - name: Import Apple signing certificate
      if: runner.os == 'macOS'
      env:
        APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      run: "if [ -z \"$APPLE_CERT_P12\" ]; then\n  echo \"APPLE_CERT_P12 unset \u2014 desktop build will ad-hoc sign (un-notarized)\"\n  exit 0\nfi\nKEYCHAIN=\"$RUNNER_TEMP/signing.keychain-db\"\
        \nKEYCHAIN_PASS=\"$(uuidgen)\"\nsecurity create-keychain -p \"$KEYCHAIN_PASS\" \"$KEYCHAIN\"\nsecurity set-keychain-settings -lut 21600 \"$KEYCHAIN\"\nsecurity\
        \ unlock-keychain -p \"$KEYCHAIN_PASS\" \"$KEYCHAIN\"\necho \"$APPLE_CERT_P12\" | base64 --decode > \"$RUNNER_TEMP/cert.p12\"\nsecurity import \"$RUNNER_TEMP/cert.p12\"\
        \ -k \"$KEYCHAIN\" -P \"$APPLE_CERT_PASSWORD\" -T /usr/bin/codesign\nsecurity set-key-partition-list -S apple-tool:,apple:,codesign: -s -k \"$KEYCHAIN_PASS\"\
        \ \"$KEYCHAIN\" >/dev/null\n# Prepend the signing keychain to the search list so codesign / find-identity see it.\nexisting_keychains=()\nwhile IFS= read\
        \ -r keychain; do\n  [ -n \"$keychain\" ] && existing_keychains+=(\"$keychain\")\ndone < <(security list-keychains -d user | sed -E 's/^[[:space:]]*\"//;\
        \ s/\"[[:space:]]*$//')\nsecurity list-keychains -d user -s \"$KEYCHAIN\" \"${existing_keychains[@]}\"\necho \"$APPLE_API_KEY_P8\" | base64 --decode > \"\
        $RUNNER_TEMP/notary.p8\"\nrm -f \"$RUNNER_TEMP/cert.p12\"\n"
    - name: Build and package
      env:
        HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != ''
          && secrets.APPLE_API_ISSUER_ID != '' }}
        APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        APPLE_NOTARIZATION_LOG_DIR: ${{ runner.temp }}/apple-notarization
      run: scripts/desktop-build.sh "${{ matrix.platform }}" "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.channel }}"
    - name: Upload Apple notarization diagnostics
      if: ${{ always() && runner.os == 'macOS' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: apple-notarization-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
        path: ${{ runner.temp }}/apple-notarization/*.json
        if-no-files-found: ignore
        retention-days: 7
    - name: Checkout protected release verifier
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: release-control
        persist-credentials: false
    - name: Smoke-test native macOS archive startup
      if: runner.os == 'macOS' && matrix.name != 'darwin-universal'
      run: |
        ditto -xk "dist/Deepzora-${{ matrix.name }}.zip" "$RUNNER_TEMP/desktop-startup"
        node desktop/packaging/verify.mjs "$RUNNER_TEMP/desktop-startup/Deepzora.app" --kind darwin-app-dir
        node desktop/packaging/smoke.mjs "$RUNNER_TEMP/desktop-startup/Deepzora.app"
    - name: Smoke-test Universal macOS candidate on Apple Silicon
      if: runner.os == 'macOS' && matrix.name == 'darwin-universal'
      run: |
        node desktop/packaging/verify.mjs desktop/build/candidate/darwin-universal/Deepzora.app --kind darwin-app-dir
        node desktop/packaging/smoke.mjs desktop/build/candidate/darwin-universal/Deepzora.app
    - name: Smoke-test packaged Linux startup
      if: runner.os == 'Linux'
      run: |
        xvfb-run -a node desktop/packaging/smoke.mjs \
          desktop/build/bin/app --service desktop/build/bin/deepzora-desktop
    - name: Smoke-test packaged Linux startup without a configured service
      if: runner.os == 'Linux'
      run: |
        xvfb-run -a node desktop/packaging/smoke.mjs desktop/build/bin/app
    - name: Upload package size report
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: package-size-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
        path: desktop/build/reports/${{ matrix.name }}
        if-no-files-found: error
        retention-days: 30
    - name: Upload desktop source maps
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: desktop-sourcemaps-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
        path: |
          desktop/build/sourcemaps/${{ matrix.name }}
          desktop/frontend/sourcemaps
        if-no-files-found: error
        retention-days: 90
    - name: Sign artifacts (minisign)
      working-directory: desktop
      env:
        MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: |
        node ../scripts/desktop-downloads.mjs prepare "${{ needs.resolve.outputs.version }}" ../dist
        go run ./cmd/sign sign ../dist/*
    - name: Bind signed artifacts to candidate and workflow
      env:
        RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        RELEASE_CONTROL_SHA: ${{ inputs.candidate_control_sha || github.workflow_sha }}
        RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
        RELEASE_ARTIFACT_PREFIX: ${{ needs.resolve.outputs.artifact_prefix }}
      run: node release-control/scripts/desktop-release-artifacts.mjs pack dist "$RUNNER_TEMP/desktop-bundle" "${{ matrix.name }}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ needs.resolve.outputs.artifact_prefix }}-${{ matrix.name }}
        path: ${{ runner.temp }}/desktop-bundle
        overwrite: true
        if-no-files-found: error
        retention-days: 7
  windows-build:
    name: build Windows candidate (${{ matrix.arch }})
    needs:
    - resolve
    - signing-contract
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.signing-contract.result == 'success' && inputs.preflight_artifact_prefix == ''
      }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: windows-latest
          platform: windows/amd64
          name: windows-amd64
          arch: amd64
        - runner: windows-11-arm
          platform: windows/arm64
          name: windows-arm64
          arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      HAS_CERTUM: ${{ secrets.CERTUM_USERNAME != '' && secrets.CERTUM_OTP_URI != '' && secrets.CERTUM_KEY_ID != '' }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.resolve.outputs.sha }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: desktop/go.mod
        cache: true
        cache-dependency-path: desktop/go.sum
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 10
        run_install: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: desktop/pnpm-lock.yaml
    - name: Install NSIS
      run: pwsh -NoProfile -File scripts/install-nsis.ps1
    - name: Require Windows Authenticode signing
      if: github.repository == 'SivanCola/deepzora' && needs.resolve.outputs.windows_signing != 'unsigned'
      run: |
        if [ "$HAS_CERTUM" != "true" ]; then
          echo "::error::Certum credentials are required for public Windows releases"
          exit 1
        fi
    - name: Build and package
      env:
        DEEPZORA_WINDOWS_PAYLOAD_ONLY: '1'
      run: scripts/desktop-build.sh "${{ matrix.platform }}" "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.channel }}"
    - name: Checkout protected release verifier
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: release-control
        persist-credentials: false
    - name: Smoke-test packaged Electron startup
      run: |
        node desktop/packaging/smoke.mjs \
          desktop/build/electron/${{ matrix.name }}/app \
          --service desktop/build/bin/deepzora-desktop.exe
    - name: Archive Windows signing inputs
      run: |
        signing_archive="$(cygpath -u "$RUNNER_TEMP")/windows-signing-inputs.tar"
        tar -cf "$signing_archive" desktop/build/windows/signing-payload desktop/build/windows/installer/deepzora_project.nsh
    - name: Upload Windows signing inputs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ needs.resolve.outputs.artifact_prefix }}-unsigned-${{ matrix.name }}
        path: ${{ runner.temp }}/windows-signing-inputs.tar
        overwrite: true
        if-no-files-found: error
        retention-days: 7
    - name: Upload package size report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: package-size-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
        path: desktop/build/reports/${{ matrix.name }}
        if-no-files-found: error
        retention-days: 30
    - name: Upload desktop source maps
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: desktop-sourcemaps-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
        path: |
          desktop/build/sourcemaps/${{ matrix.name }}
          desktop/frontend/sourcemaps
        if-no-files-found: error
        retention-days: 30
  windows-sign:
    name: finalize Windows candidate (${{ needs.resolve.outputs.windows_signing }})
    needs:
    - resolve
    - windows-build
    - signing-contract
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.windows-build.result == 'success' && needs.signing-contract.result == 'success'
      && github.repository == 'SivanCola/deepzora' }}
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    concurrency:
      group: certum-signing
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.resolve.outputs.sha }}
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: release-control
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: desktop/go.mod
        cache-dependency-path: desktop/go.sum
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .node-version
    - name: Reuse completed signed architectures from an earlier attempt
      id: reuse
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
        RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
        RELEASE_ARTIFACT_PREFIX: ${{ needs.resolve.outputs.artifact_prefix }}
        RELEASE_RUNNER_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail
        runner_temp="$(cygpath -u "$RELEASE_RUNNER_TEMP")"
        mkdir -p "$runner_temp/completed"
        missing=()
        for arch in amd64 arm64; do
          name="${{ needs.resolve.outputs.artifact_prefix }}-windows-$arch"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts | map(select(.name == \"$name\" and .expired == false)) | sort_by(.id) | last | .id // empty")"
          if [ -z "$artifact_id" ]; then
            echo "$arch=false" >> "$GITHUB_OUTPUT"
            missing+=("$arch")
            continue
          fi
          mkdir -p "$runner_temp/completed/$arch"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$runner_temp/completed/$arch.zip"
          unzip -q "$runner_temp/completed/$arch.zip" -d "$runner_temp/completed/$arch"
          node release-control/scripts/desktop-release-artifacts.mjs verify \
            "$runner_temp/completed/$arch" "windows-$arch"
          echo "$arch=true" >> "$GITHUB_OUTPUT"
          echo "Reusing signed Windows $arch bundle from artifact $artifact_id." >> "$GITHUB_STEP_SUMMARY"
        done
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "needs_signing=false" >> "$GITHUB_OUTPUT"
        else
          echo "needs_signing=true" >> "$GITHUB_OUTPUT"
          printf 'Architectures requiring signing: %s\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
        fi
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: steps.reuse.outputs.needs_signing == 'true'
      with:
        name: ${{ needs.resolve.outputs.artifact_prefix }}-unsigned-windows-amd64
        path: ${{ runner.temp }}/signing-inputs/amd64
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: steps.reuse.outputs.needs_signing == 'true'
      with:
        name: ${{ needs.resolve.outputs.artifact_prefix }}-unsigned-windows-arm64
        path: ${{ runner.temp }}/signing-inputs/arm64
    - name: Restore both native-tested Windows payloads
      if: steps.reuse.outputs.needs_signing == 'true'
      env:
        RELEASE_RUNNER_TEMP: ${{ runner.temp }}
      run: |
        runner_temp="$(cygpath -u "$RELEASE_RUNNER_TEMP")"
        for arch in amd64 arm64; do
          [ ! -d "$runner_temp/completed/$arch" ] || continue
          mkdir -p "$runner_temp/signing-work/$arch"
          tar -xf "$runner_temp/signing-inputs/$arch/windows-signing-inputs.tar" -C "$runner_temp/signing-work/$arch"
          cp -R "$runner_temp/signing-work/$arch/desktop/build/windows/signing-payload" "signed-payload-$arch"
          node desktop/packaging/signing-files.mjs "signed-payload-$arch" --check
        done
    - name: Install NSIS
      if: steps.reuse.outputs.needs_signing == 'true'
      shell: pwsh
      run: ./release-control/scripts/install-nsis.ps1
    - name: Connect to Certum
      if: steps.reuse.outputs.needs_signing == 'true' && needs.resolve.outputs.windows_signing != 'unsigned'
      uses: ./release-control/.github/actions/setup-certum
      with:
        username: ${{ secrets.CERTUM_USERNAME }}
        otp-uri: ${{ secrets.CERTUM_OTP_URI }}
        thumbprint: ${{ secrets.CERTUM_KEY_ID }}
    - name: Sign both payloads in the shared Certum session
      if: steps.reuse.outputs.needs_signing == 'true'
      env:
        CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
        RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
        RELEASE_ARTIFACT_PREFIX: ${{ needs.resolve.outputs.artifact_prefix }}
        RELEASE_RUNNER_TEMP: ${{ runner.temp }}
        REUSE_AMD64: ${{ steps.reuse.outputs.amd64 }}
        REUSE_ARM64: ${{ steps.reuse.outputs.arm64 }}
      run: |
        runner_temp="$(cygpath -u "$RELEASE_RUNNER_TEMP")"
        for arch in amd64 arm64; do
          reuse_var="REUSE_${arch^^}"
          [ "${!reuse_var}" != "true" ] || continue
          FINALIZE_PHASE=sign bash release-control/scripts/finalize-windows-signed-candidate.sh "$arch" \
            "$runner_temp/signing-work/$arch" "signed-payload-$arch" "dist-$arch" \
            "$runner_temp/desktop-bundle-$arch" "${{ needs.resolve.outputs.version }}"
        done
    - name: Package both architectures in parallel
      if: steps.reuse.outputs.needs_signing == 'true'
      env:
        CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
        RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
        RELEASE_ARTIFACT_PREFIX: ${{ needs.resolve.outputs.artifact_prefix }}
        RELEASE_RUNNER_TEMP: ${{ runner.temp }}
        REUSE_AMD64: ${{ steps.reuse.outputs.amd64 }}
        REUSE_ARM64: ${{ steps.reuse.outputs.arm64 }}
      run: |
        set -euo pipefail
        runner_temp="$(cygpath -u "$RELEASE_RUNNER_TEMP")"
        work="$(pwd)"
        pids=()
        for arch in amd64 arm64; do
          reuse_var="REUSE_${arch^^}"
          [ "${!reuse_var}" != "true" ] || continue
          root="$work"
          if [ "$arch" != amd64 ]; then
            root="$runner_temp/product-$arch"
            git worktree add --detach "$root" HEAD
          fi
          (cd "$root" && FINALIZE_PHASE=package bash "$work/release-control/scripts/finalize-windows-signed-candidate.sh" "$arch" \
            "$runner_temp/signing-work/$arch" "$work/signed-payload-$arch" "$work/dist-$arch" \
            "$runner_temp/desktop-bundle-$arch" "${{ needs.resolve.outputs.version }}") \
            > "$runner_temp/package-$arch.log" 2>&1 &
          pids+=("$!:$arch")
        done
        failed=0
        for entry in "${pids[@]}"; do
          arch="${entry#*:}"
          if ! wait "${entry%%:*}"; then failed=1; echo "::error::packaging windows-$arch failed"; fi
          echo "::group::package windows-$arch"
          cat "$runner_temp/package-$arch.log"
          echo "::endgroup::"
        done
        exit "$failed"
    - name: Seal amd64 in the shared Certum session
      if: steps.reuse.outputs.amd64 != 'true'
      env:
        CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
        RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
        RELEASE_ARTIFACT_PREFIX: ${{ needs.resolve.outputs.artifact_prefix }}
        RELEASE_RUNNER_TEMP: ${{ runner.temp }}
        REUSE_AMD64: ${{ steps.reuse.outputs.amd64 }}
        REUSE_ARM64: ${{ steps.reuse.outputs.arm64 }}
      run: |
        runner_temp="$(cygpath -u "$RELEASE_RUNNER_TEMP")"
        work="$(pwd)"
        root="$work"
        (cd "$root" && FINALIZE_PHASE=seal bash "$work/release-control/scripts/finalize-windows-signed-candidate.sh" amd64 \
          "$runner_temp/signing-work/amd64" "$work/signed-payload-amd64" "$work/dist-amd64" \
          "$runner_temp/desktop-bundle-amd64" "${{ needs.resolve.outputs.version }}")
        if [ "$root" != "$work" ]; then
          mkdir -p desktop/build/reports
          cp -R "$root/desktop/build/reports/windows-amd64" desktop/build/reports/
        fi
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: steps.reuse.outputs.amd64 != 'true'
      with:
        name: ${{ needs.resolve.outputs.artifact_prefix }}-windows-amd64
        path: ${{ runner.temp }}/desktop-bundle-amd64
        overwrite: true
        if-no-files-found: error
        retention-days: 7
    - name: Seal arm64 in the shared Certum session
      if: steps.reuse.outputs.arm64 != 'true'
      env:
        CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        RELEASE_CONTROL_SHA: ${{ github.workflow_sha }}
        RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
        RELEASE_ARTIFACT_PREFIX: ${{ needs.resolve.outputs.artifact_prefix }}
        RELEASE_RUNNER_TEMP: ${{ runner.temp }}
        REUSE_AMD64: ${{ steps.reuse.outputs.amd64 }}
        REUSE_ARM64: ${{ steps.reuse.outputs.arm64 }}
      run: |
        runner_temp="$(cygpath -u "$RELEASE_RUNNER_TEMP")"
        work="$(pwd)"
        root="$runner_temp/product-arm64"
        (cd "$root" && FINALIZE_PHASE=seal bash "$work/release-control/scripts/finalize-windows-signed-candidate.sh" arm64 \
          "$runner_temp/signing-work/arm64" "$work/signed-payload-arm64" "$work/dist-arm64" \
          "$runner_temp/desktop-bundle-arm64" "${{ needs.resolve.outputs.version }}")
        if [ "$root" != "$work" ]; then
          mkdir -p desktop/build/reports
          cp -R "$root/desktop/build/reports/windows-arm64" desktop/build/reports/
        fi
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: steps.reuse.outputs.arm64 != 'true'
      with:
        name: ${{ needs.resolve.outputs.artifact_prefix }}-windows-arm64
        path: ${{ runner.temp }}/desktop-bundle-arm64
        overwrite: true
        if-no-files-found: error
        retention-days: 7
    - name: Upload signed package size reports
      if: steps.reuse.outputs.needs_signing == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: package-size-${{ github.run_id }}-${{ github.run_attempt }}-windows-signed
        path: desktop/build/reports/windows-*
        overwrite: true
        if-no-files-found: error
        retention-days: 30
  windows-runtime-acceptance:
    name: verify Windows installer (${{ matrix.arch }}, ${{ needs.resolve.outputs.windows_signing }})
    needs:
    - resolve
    - windows-sign
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.windows-sign.result == 'success' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: windows-latest
          arch: amd64
        - runner: windows-11-arm
          arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: release-control
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.resolve.outputs.artifact_prefix }}-windows-${{ matrix.arch }}
        path: ${{ runner.temp }}/windows-bundle
    - name: Install and smoke-test exact Windows installer
      shell: pwsh
      run: |
        $installer = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/windows-bundle/files" -Filter '*installer.exe' -File)
        if ($installer.Count -ne 1) { throw "Expected one signed installer, found $($installer.Count)" }
        ./release-control/scripts/test-windows-installer-startup.ps1 `
          -InstallerPath $installer[0].FullName `
          -ExpectedVersion "${{ needs.resolve.outputs.version }}" `
          -EvidenceDirectory "$env:RUNNER_TEMP/deepzora-installer-acceptance"
    - name: Upload signed Windows installer acceptance evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: windows-installer-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}-signed
        path: |
          ${{ runner.temp }}/deepzora-installer-acceptance/**/*.json
          ${{ runner.temp }}/deepzora-installer-acceptance/**/*.png
          ${{ runner.temp }}/deepzora-installer-acceptance/**/*.log
          !${{ runner.temp }}/deepzora-installer-acceptance/installed/**
          !${{ runner.temp }}/deepzora-installer-acceptance/**/cache/**
        if-no-files-found: ignore
        retention-days: 90
    - name: Record Windows acceptance receipt
      shell: pwsh
      run: |
        $bundle = "$env:RUNNER_TEMP/windows-bundle/files"
        $installer = @(Get-ChildItem -LiteralPath $bundle -Filter '*installer.exe' -File)
        if ($installer.Count -ne 1) { throw "Expected one signed installer, found $($installer.Count)" }
        @{ schema = 1; kind = "windows-${{ matrix.arch }}"; status = 'passed'; version = "${{ needs.resolve.outputs.version }}"; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer[0].FullName).Hash.ToLowerInvariant() } |
          ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/windows-${{ matrix.arch }}.json" -Encoding utf8
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ needs.resolve.outputs.artifact_prefix }}-receipt-windows-${{ matrix.arch }}
        path: ${{ runner.temp }}/windows-${{ matrix.arch }}.json
        overwrite: true
        if-no-files-found: error
        retention-days: 90
  mac-universal-intel:
    name: verify Universal candidate on Intel
    needs:
    - resolve
    - build
    - signing-contract
    if: ${{ always() && !cancelled() && needs.signing-contract.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && false))
      && inputs.preflight_artifact_prefix == '' }}
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.resolve.outputs.sha }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .node-version
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 10
    - name: Install packaged smoke dependencies
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      run: pnpm --dir desktop install --frozen-lockfile
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.resolve.outputs.artifact_prefix }}-darwin-universal
        path: ${{ runner.temp }}/universal-bundle
        github-token: ${{ github.token }}
        run-id: ${{ github.run_id }}
    - name: Mount and smoke-test the exact Universal DMG
      run: |
        mount_dir="$RUNNER_TEMP/deepzora-universal"
        app_dir="$RUNNER_TEMP/deepzora-universal-app/Deepzora.app"
        mkdir -p "$mount_dir" "$(dirname "$app_dir")"
        hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$RUNNER_TEMP/universal-bundle/files/Deepzora-darwin-universal.dmg"
        trap 'hdiutil detach "$mount_dir"' EXIT
        ditto "$mount_dir/Deepzora.app" "$app_dir"
        codesign --verify --deep --strict "$app_dir"
        node desktop/packaging/verify.mjs "$app_dir" --kind darwin-app-dir
        node desktop/packaging/smoke.mjs "$app_dir"
    - name: Record Intel macOS acceptance receipt
      run: |
        jq -n --arg version "${{ needs.resolve.outputs.version }}" \
          --arg sha256 "$(shasum -a 256 "$RUNNER_TEMP/universal-bundle/files/Deepzora-darwin-universal.dmg" | awk '{print $1}')" \
          '{schema: 1, kind: "macos-universal-intel", status: "passed", version: $version, sha256: $sha256}' \
          > "$RUNNER_TEMP/macos-universal-intel.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ needs.resolve.outputs.artifact_prefix }}-receipt-macos-universal-intel
        path: ${{ runner.temp }}/macos-universal-intel.json
        overwrite: true
        if-no-files-found: error
        retention-days: 90
  publish:
    name: publish release
    needs:
    - resolve
    - signing-contract
    - build
    - windows-build
    - windows-sign
    - windows-runtime-acceptance
    - mac-universal-intel
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.preflight_artifact_prefix
      != '' && inputs.orchestrated && inputs.signing_preflight_verified)) && (needs.windows-build.result == 'success' || (needs.windows-build.result == 'skipped'
      && inputs.preflight_artifact_prefix != '' && inputs.orchestrated && inputs.signing_preflight_verified)) && ((inputs.preflight_artifact_prefix == '' && needs.mac-universal-intel.result
      == 'success') || (inputs.preflight_artifact_prefix != '' && needs.mac-universal-intel.result == 'skipped')) && needs.signing-contract.result == 'success' &&
      (needs.windows-sign.result == 'success' || (needs.windows-sign.result == 'skipped' && (false || inputs.preflight_artifact_prefix != ''))) && (needs.windows-sign.result
      != 'success' || needs.windows-runtime-acceptance.result == 'success') && !inputs.production_signing_smoke && !inputs.signing_preflight }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ needs.resolve.outputs.sha }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        path: release-control
        ref: ${{ github.workflow_sha }}
    - name: Revalidate immutable Desktop candidate
      env:
        RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        IN_ORCHESTRATED: ${{ inputs.orchestrated }}
        IN_ORCHESTRATOR: ${{ inputs.orchestrator }}
        APPROVED_SHA: ${{ needs.resolve.outputs.sha }}
        CALLER_EVENT_NAME: ${{ github.event_name }}
        CALLER_REF: ${{ github.ref }}
        CALLER_REF_PROTECTED: ${{ github.ref_protected }}
        CALLER_SHA: ${{ github.sha }}
        CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
        REQUIRE_CURRENT_MAIN: false
        VERIFY_RELEASE_CHECKOUT: true
      run: bash release-control/scripts/resolve-desktop-candidate.sh
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: desktop/go.mod
        cache: true
        cache-dependency-path: desktop/go.sum
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .node-version
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: ${{ runner.temp }}/desktop-bundles
        pattern: ${{ inputs.preflight_artifact_prefix || needs.resolve.outputs.artifact_prefix }}-{darwin-arm64,darwin-amd64,darwin-universal,windows-amd64,windows-arm64,linux-amd64}
        github-token: ${{ github.token }}
        run-id: ${{ github.run_id }}
    - name: Verify complete signed artifact handoff
      env:
        RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        RELEASE_CONTROL_SHA: ${{ inputs.candidate_control_sha || github.workflow_sha }}
        RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
        RELEASE_SIGNING_FINGERPRINT: ${{ needs.signing-contract.outputs.fingerprint }}
        RELEASE_ARTIFACT_PREFIX: ${{ inputs.preflight_artifact_prefix || needs.resolve.outputs.artifact_prefix }}
        RELEASE_PRODUCER_RUN_ID: ${{ inputs.candidate_source_run_id || github.run_id }}
        RELEASE_PRODUCER_RUN_ATTEMPT: ${{ inputs.candidate_source_run_attempt || github.run_attempt }}
      run: |
        node release-control/scripts/desktop-release-artifacts.mjs collect "$RUNNER_TEMP/desktop-bundles" dist
    - name: Generate manifest
      working-directory: desktop
      run: go run ./cmd/sign manifest ../dist "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.tag }}" "${{ needs.resolve.outputs.notes_version }}"
    - name: Validate generated manifest before publication
      env:
        CHANNEL: ${{ needs.resolve.outputs.channel }}
        PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        TAG: ${{ needs.resolve.outputs.tag }}
        VERSION: ${{ needs.resolve.outputs.version }}
        NOTES_VERSION: ${{ needs.resolve.outputs.notes_version }}
      run: |
        set -euo pipefail
        validation_channel="$CHANNEL"
        bash release-control/scripts/validate-desktop-release-manifest.sh \
          "$validation_channel" "$VERSION" \
          "https://github.com/SivanCola/deepzora/releases/download/${TAG}/" \
          dist/latest.json "$NOTES_VERSION"
    - name: Download orchestrator-reviewed release notes
      if: ${{ inputs.orchestrated }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: orchestrator-reviewed-release-notes
        path: /tmp/orchestrator-reviewed-release-notes
    - name: Use orchestrator-reviewed release notes
      if: ${{ inputs.orchestrated }}
      run: |
        test -s /tmp/orchestrator-reviewed-release-notes/release-notes.md
        cp /tmp/orchestrator-reviewed-release-notes/release-notes.md /tmp/release-notes.md
    - name: Render reviewed release notes
      if: ${{ !inputs.orchestrated }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/release-notes.mjs render --version "${{ needs.resolve.outputs.notes_version }}" --output /tmp/release-notes.md
    - name: Revalidate approved release ref
      if: ${{ inputs.orchestrated }}
      env:
        RELEASE_TAG: ${{ inputs.approved_cli_tag }}
        APPROVED_SHA: ${{ inputs.approved_sha }}
      run: bash scripts/verify-release-tag.sh
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash release-control/scripts/publish-desktop-github-release.sh "${{ needs.resolve.outputs.tag }}" "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.prerelease
        }}" /tmp/release-notes.md dist
  attest-signing-contract:
    name: record standalone Windows signing attestation
    needs:
    - signing-contract
    - build
    - windows-build
    - windows-sign
    - windows-runtime-acceptance
    if: ${{ always() && !cancelled() && inputs.signing_preflight && !inputs.orchestrated && github.repository == 'SivanCola/deepzora' && needs.signing-contract.result
      == 'success' && needs.build.result == 'success' && needs.windows-build.result == 'success' && needs.windows-sign.result == 'success' && needs.windows-runtime-acceptance.result
      == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VARIABLE_NAME: RELEASE_SIGNING_ATTESTATION
      VARIABLE_VALUE: ${{ needs.signing-contract.outputs.fingerprint }}
    steps:
    - name: Record verified signing contract
      run: |
        mkdir -p signing-attestation
        jq -n --arg fingerprint "$VARIABLE_VALUE" --arg workflow_sha "$GITHUB_SHA" \
          --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
          '{fingerprint: $fingerprint, workflow_sha: $workflow_sha, run_id: $run_id, run_attempt: $run_attempt}' \
          > signing-attestation/verified-contract.json
        {
          echo "Both Windows signing jobs verified this contract: $VARIABLE_VALUE"
          echo 'For standalone recovery, a maintainer must promote this verified fingerprint:'
          echo '```sh'
          echo "gh variable set $VARIABLE_NAME --repo $GITHUB_REPOSITORY --body '$VARIABLE_VALUE'"
          echo '```'
          echo 'GITHUB_TOKEN cannot write repository variables. Orchestrated releases use same-run preflight evidence.'
        } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: verified-signing-contract-${{ github.run_id }}-${{ github.run_attempt }}
        path: signing-attestation/verified-contract.json
        if-no-files-found: error
        retention-days: 90
