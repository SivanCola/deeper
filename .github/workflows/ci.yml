name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}

permissions:
  contents: read

concurrency:
  # Push cancellation is handled by Supersede CI, which preserves the code
  # ancestor still required by a release-notes-only candidate.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep required contexts visible for unrelated changes. Unknown input or a
  # failed detector runs checks conservatively, and desktop aggregation also
  # requires successful detection. Main pushes retain the notes-only exception.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      desktop: ${{ steps.filter.outputs.desktop }}
      sdk: ${{ steps.filter.outputs.sdk }}
      release_control: ${{ steps.filter.outputs.release_control }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$EVENT_NAME" = pull_request ]; then
            args+=(--base "$BASE_SHA" --mode pull_request)
          else
            # Main pushes retain the complete qualification matrix after the
            # existing release-notes-only exception is evaluated.
            args+=(--base "$BASE_SHA" --mode push --full)
          fi
          node scripts/ci-paths.mjs "${args[@]}"

  # Preserve the required per-OS contexts and execute each root suite once.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RUN_STEPS: ${{ needs.changes.result != 'success' || needs.changes.outputs.code != 'false' }}
      DEEPZORA_RELEASE_CACHE_GUARD: "1"
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install Linux sandbox backend
        if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true
      - name: Build and test root module
        if: env.RUN_STEPS == 'true'
        run: |
          go build ./...
          go test -timeout=15m ./...
      - name: Test both Windows PowerShell runtimes
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($program in @('pwsh', 'powershell.exe')) {
            $env:DEEPZORA_TEST_PWSH = (Get-Command $program).Source
            go test -timeout=2m -run '^TestPowerShell' ./internal/persistentshell
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # The nested SDK and release-control contracts are platform-independent.
  root:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_STEPS: ${{ needs.changes.result != 'success' || needs.changes.outputs.code != 'false' || needs.changes.outputs.sdk != 'false' || needs.changes.outputs.release_control != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Verify SDK
        if: env.RUN_STEPS == 'true'
        working-directory: sdk/go
        run: |
          test "$(go list -m all)" = github.com/SivanCola/deepzora/sdk/go
          go vet ./...
          go test -race ./...
      - name: Validate workflows
        if: env.RUN_STEPS == 'true'
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -ignore 'label "windows-11-arm" is unknown' \
            -ignore 'label "macos-15-intel" is unknown'
      - name: Verify CI and release contracts
        if: env.RUN_STEPS == 'true'
        run: |
          node --test scripts/*.test.mjs npm/publish.test.mjs
          bash scripts/validate-release-candidate-source.test.sh
          bash scripts/validate-release-control-plane.test.sh
          bash scripts/verify-release-push-ci.test.sh
          bash scripts/release-stable.test.sh
          bash scripts/release-candidate-tags.test.sh
          bash scripts/verify-release-authorization.test.sh
          bash scripts/release-workflows.test.sh
          node scripts/check-single-release-public-contract.mjs

  race:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPZORA_RELEASE_CACHE_GUARD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install Linux sandbox backend
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true
      - name: Check concurrent runtime owners
        run: |
          go test -race -timeout=15m ./internal/agent/... ./internal/plugin/... ./internal/jobs/... \
            ./internal/proc/... ./internal/sandbox/... ./internal/filelock/... ./internal/eventwire/... \
            ./internal/remote/... ./internal/extension/... ./internal/boot/... ./internal/control/... \
            ./internal/tool/... ./internal/bot/... ./internal/config/... ./internal/session/... \
            ./internal/serve/... ./internal/sessioninbox/...

  desktop-frontend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    env:
      DEEPZORA_COMMIT: ${{ github.sha }}
      DEEPZORA_TEST_CONCURRENCY: "2"
    outputs:
      producer_attempt: ${{ steps.identity.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: desktop/go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify generated host contract
        run: |
          go run . -emit-contract frontend/src/generated
          git diff --exit-code -- frontend/src/generated
      - name: Build frontend once
        run: pnpm --dir frontend build:electron
      - name: Record artifact identity
        id: identity
        run: |
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          node frontend/scripts/artifact-identity.mjs create --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --pnpm-version "$(pnpm --version)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-frontend-${{ github.run_id }}
          path: |
            desktop/frontend/dist
            desktop/frontend/.deepzora-frontend-artifact.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Verify frontend test inventory
        run: node --test frontend/scripts/ci-test-plan.test.mjs
      - name: Test frontend once per suite
        run: node frontend/scripts/run-ci-tests.mjs
      - name: Test and build Electron
        run: |
          pnpm --dir electron typecheck
          pnpm --dir electron test
          pnpm --dir electron build
          node --test packaging/*.test.mjs
      - name: Check transcript and approval behavior in Chromium
        run: |
          PLAYWRIGHT_BROWSERS_PATH=.pw-browsers pnpm --dir frontend exec playwright install --with-deps chromium
          xvfb-run -a pnpm --dir frontend test:motion-browser
          xvfb-run -a pnpm --dir frontend test:transcript-browser

  desktop-go:
    needs: [changes, desktop-frontend]
    if: ${{ !cancelled() && needs.desktop-frontend.result == 'success' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-frontend-${{ github.run_id }}
          path: desktop/frontend
      - name: Verify frontend artifact
        run: |
          node frontend/scripts/artifact-identity.mjs verify --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" \
            --attempt "${{ needs.desktop-frontend.outputs.producer_attempt }}" --pnpm-version "$(pnpm --version)"
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true
      - name: Test desktop module
        env:
          DESKTOP_TEST_TIMEOUT: ${{ runner.os == 'Windows' && '25m' || '15m' }}
        run: |
          go vet ./...
          go build ./...
          go test -timeout="$DESKTOP_TEST_TIMEOUT" ./...
      - name: Check desktop lifecycle races on macOS
        if: runner.os == 'macOS'
        run: go test -race -timeout=10m -run 'Test.*(Title|BotConnection|Deferred|Terminal|DarwinWorkspaceWatcher)' .
      - name: Check native build tags
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: desktop
          args: --timeout=5m

  desktop:
    needs: [changes, desktop-frontend, desktop-go]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require complete desktop evidence
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
          FRONTEND_RESULT: ${{ needs.desktop-frontend.result }}
          GO_RESULT: ${{ needs.desktop-go.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          expected=success
          if [ "$DESKTOP_REQUIRED" = false ]; then expected=skipped; fi
          test "$FRONTEND_RESULT" = "$expected"
          test "$GO_RESULT" = "$expected"

  lint:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_STEPS: ${{ needs.changes.result != 'success' || needs.changes.outputs.code != 'false' || needs.changes.outputs.desktop != 'false' || needs.changes.outputs.sdk != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Check formatting and repository standards
        if: env.RUN_STEPS == 'true'
        run: |
          test -z "$(git ls-files '*.go' | xargs gofmt -l)"
          go run ./tools/repolint
      - name: Lint root module
        if: env.RUN_STEPS == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Lint root platform tags
        if: env.RUN_STEPS == 'true'
        run: |
          for target in darwin windows; do
            GOOS="$target" golangci-lint run --timeout=5m ./...
          done
