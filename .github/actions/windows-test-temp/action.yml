name: Windows Go test temporary directory
description: Keep native test files on the hosted runner workspace volume instead of the system profile volume.
runs:
  using: composite
  steps:
    - name: Select runner temporary storage for native Go tests
      shell: pwsh
      run: |
        if ($env:RUNNER_OS -ne 'Windows') { throw 'Windows test storage requires a Windows runner' }
        if (-not $env:RUNNER_TEMP -or -not [IO.Path]::IsPathFullyQualified($env:RUNNER_TEMP)) {
          throw 'RUNNER_TEMP must be an absolute path'
        }
        $testTemp = Join-Path $env:RUNNER_TEMP 'deepzora-go-tests'
        New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
        # Keep a real second-volume location for native junction coverage.
        "DEEPZORA_TEST_SYSTEM_TEMP=$env:TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Native Go test temporary directory: $testTemp (previous TEMP: $env:TEMP)"
