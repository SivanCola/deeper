name: Windows root test tools
description: Use the installed Git Bash rather than a WSL launcher, and verify native shell startup before concurrent packages.
runs:
  using: composite
  steps:
    - name: Select the installed Git Bash
      shell: pwsh
      run: |
        $gitDirectory = Split-Path (Get-Command git -ErrorAction Stop).Source -Parent
        $bash = [IO.Path]::GetFullPath((Join-Path $gitDirectory '..\bin\bash.exe'))
        if (-not (Test-Path -LiteralPath $bash -PathType Leaf)) { throw "Git Bash missing: $bash" }
        Split-Path $bash -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Host "Selected Git Bash: $bash"
    - name: Check Windows SSH and Bash startup
      shell: bash
      run: |
        node -e "const {execFileSync}=require('node:child_process'); for(const [program,args,timeout] of [['ssh',['-V'],15000],['bash',['-c','true'],3000]]){execFileSync('where.exe',[program],{stdio:'inherit'});execFileSync(program,args,{stdio:'inherit',timeout});}"
