name: Go build cache
description: >-
  Restore or save the newest Go module and build cache for one module namespace.
  setup-go keys its cache on go.sum alone and GitHub never rewrites an existing
  key, so that snapshot freezes at the last dependency change and every package
  touched since misses. A short job sharing the key can freeze a cache far
  smaller than a long job then restores, which is how one Linux root cache ended
  up holding almost nothing. Two invariants follow: every key carries the run id
  so no save can ever freeze, and each job class owns its own namespace so a
  light job cannot claim a key a heavy job depends on. Keys are restored by
  prefix, so a dependency bump downloads only the delta. GOMODCACHE holds
  extracted module source and is byte-identical on every platform, so it is
  shared across operating systems; GOCACHE holds compiled output and stays keyed
  per OS and architecture. Because the module key carries no platform, every leg
  of a matrix targets the same key, so only save_mod_os may write it; otherwise
  each leg uploads the same archive and the last one to finish decides which
  platform's tar becomes the shared copy, under enableCrossOsArchive: false.
  Saving is restricted to a main push; pull requests restore only.

inputs:
  module:
    description: Cache namespace, e.g. root, root-race, root-tools, desktop
    required: true
  dependency:
    description: Space-separated go.sum paths that define this module's cache identity
    required: false
    default: go.sum
  build_module:
    description: Namespace for GOCACHE when a job builds less than its module's other jobs
    required: false
    default: ""
  save_mod_os:
    description: >-
      runner.os allowed to write the shared module cache; empty disables that
      write, for a job that should only seed its own build cache
    required: false
    default: Linux
  mode:
    description: restore (default) or save
    required: false
    default: restore

runs:
  using: composite
  steps:
    # Defaults in the calling job can set a working directory, and the desktop
    # jobs set one, so every path here is resolved from the workspace root.
    - id: key
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        sums="$(git hash-object ${{ inputs.dependency }} | git hash-object --stdin)"
        sums="${sums:0:16}"
        # Dependencies are the same for every job of a module, so they share one
        # namespace; compiled output is not, so a job that builds a subset keeps
        # its own instead of letting a narrower build claim the shared key.
        build_ns="${{ inputs.build_module }}"
        if [ -z "$build_ns" ]; then build_ns="${{ inputs.module }}"; fi
        mod_base="go-${{ inputs.module }}-${sums}"
        build_base="go-${build_ns}-${sums}"
        # actions/cache resolves paths itself; backslashes from the Windows
        # runner survive tar extraction more reliably as forward slashes.
        mod_dir="$(go env GOMODCACHE | sed 's#\\#/#g')"
        build_dir="$(go env GOCACHE | sed 's#\\#/#g')"
        # A cache restore over a path that does not exist yet reports a
        # validation warning and matches nothing; Go creates neither directory
        # until its first command, so create them up front.
        mkdir -p "$mod_dir" "$build_dir"
        {
          echo "mod_key=${mod_base}-mod-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "mod_restore=${mod_base}-mod-"
          echo "mod_paths=${mod_dir}"
          echo "build_key=${build_base}-build-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "build_restore=${build_base}-build-${{ runner.os }}-${{ runner.arch }}-"
          echo "build_paths=${build_dir}"
        } >> "$GITHUB_OUTPUT"

    - if: inputs.mode == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.key.outputs.mod_paths }}
        key: ${{ steps.key.outputs.mod_key }}
        restore-keys: ${{ steps.key.outputs.mod_restore }}

    - if: inputs.mode == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.key.outputs.build_paths }}
        key: ${{ steps.key.outputs.build_key }}
        restore-keys: ${{ steps.key.outputs.build_restore }}

    # always() so a failing test suite still leaves the download it performed
    # for the next run; push-only so fork pull requests never write and the
    # repository cache stays bounded by main traffic.
    - if: inputs.mode == 'save' && always() && github.event_name == 'push' && runner.os == inputs.save_mod_os
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.key.outputs.mod_paths }}
        key: ${{ steps.key.outputs.mod_key }}

    - if: inputs.mode == 'save' && always() && github.event_name == 'push'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.key.outputs.build_paths }}
        key: ${{ steps.key.outputs.build_key }}
