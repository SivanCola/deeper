version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pi-catalog:
        patterns: ["github.com/sky-valley/pi"]
        update-types: ["minor", "patch"]
      go:
        patterns: ["*"]
        exclude-patterns: ["github.com/sky-valley/pi"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    # The frontend and Electron share this workspace's pnpm lockfile.
    directory: "/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Our architecture checks use the TypeScript 6 compiler API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
